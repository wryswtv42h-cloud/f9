name: MLD quality checks

on:
  push:
    branches:
      - main
      - mld-full-rebuild-2026-10-16
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  syntax-and-smoke-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Run syntax checks and smoke tests
        run: npm run check
